<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- tern app icon master: an Arctic tern in flight over a dusk sky, on the macOS 824 px squircle. Rendered to tern.icns by scripts/make-icon.sh. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18224a"/>
      <stop offset="0.5" stop-color="#4b4688"/>
      <stop offset="0.8" stop-color="#c9809a"/>
      <stop offset="1" stop-color="#f3b07e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.68" cy="0.86" r="0.42">
      <stop offset="0" stop-color="#ffe2b0" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffc58c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffc58c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sun)"/>
    <rect x="100" y="100" width="824" height="420" fill="url(#sheen)"/>
  </g>
  <!-- Arctic tern in flight toward the upper right. -->
  <g transform="translate(540 515) rotate(-24) scale(0.9)" fill="#fbfbff">
    <!-- far wing: up from the shoulder, bent at the wrist, tip swept back -->
    <path d="M 40 -18 C 20 -70 -10 -110 -40 -140 C -80 -180 -150 -230 -250 -262
             C -190 -210 -140 -170 -110 -130 C -80 -95 -50 -55 -24 -8 Z"/>
    <!-- near wing: down from the shoulder, longer, bent, swept back -->
    <path d="M 36 20 C 18 72 -8 118 -36 152 C -74 196 -140 250 -238 290
             C -178 236 -132 192 -104 148 C -76 104 -48 62 -26 14 Z"/>
    <!-- body: slim torpedo, head forward -->
    <path d="M 128 -10 C 100 -24 60 -26 20 -20 C -40 -12 -100 -4 -150 6
             C -100 16 -40 22 20 22 C 60 22 100 16 128 6 Z"/>
    <!-- head and pointed bill -->
    <path d="M 124 -12 C 150 -16 170 -12 182 -4 L 236 -2 L 182 6 C 168 14 148 16 124 8 Z"/>
    <!-- black cap -->
    <path d="M 120 -12 C 146 -18 168 -14 182 -5 C 160 -6 140 -6 118 -2 Z" fill="#18224a"/>
    <!-- forked tail streamers -->
    <path d="M -146 2 C -200 -18 -250 -40 -312 -70 C -260 -30 -214 -6 -170 10 Z"/>
    <path d="M -146 10 C -200 26 -252 46 -316 70 C -262 34 -214 18 -170 6 Z"/>
  </g>
</svg>
