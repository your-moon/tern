# cargo-deny: license compatibility with GPL-3.0, known vulnerabilities, duplicate deps.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates are flagged only when tern depends on them directly. paste, rustybuzz and
# ttf-parser arrive through gpui-pre, which tern cannot change; vulnerabilities are still flagged.
unmaintained = "workspace"
ignore = [
  # Marvin timing side channel in the `rsa` crate, reached through russh. No fixed release exists
  # (rsa 0.9.10 and 0.10.0-rc.18 are both affected). The attack needs many timed private-key
  # operations; tern does at most one RSA signature per login, and host-key checks are public-key
  # only. Dropping russh's `rsa` feature would remove RSA host and user keys. Tracked in #16.
  { id = "RUSTSEC-2023-0071", reason = "no fix upstream; one signature per login; see #16" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "GPL-3.0-or-later", "GPL-3.0-only", "LGPL-2.1-or-later", "LGPL-3.0-or-later",
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0", "0BSD", "Unlicense",
  # libbz2-rs-sys (via gpui-pre): BSD-style permissive licence, compatible with GPL-3.0.
  "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
